# =============================================================
#  api_keys.example.yaml —— 密钥配置文件模板（本文件入库，不含任何真实密钥）
#
#  使用方法：
#     cp api_keys.example.yaml api_keys.yaml
#     然后填入你自己的密钥即可。
#
#  api_keys.yaml 已在 .gitignore 中，不会被提交。
#  除了这个配置文件，也可以直接用系统环境变量提供密钥，两种方式等价
#  （环境变量优先级更高）：
#     Linux / macOS : export NSCC_API_KEY="sk-..."
#     PowerShell    : $env:NSCC_API_KEY="sk-..."
# =============================================================

# 国家超算长沙中心 MaaS（对应 config.yaml 的 nscc 档位）
NSCC_API_KEY: ""

# 备用密钥（可选）：主 key 额度耗尽或失效时自动轮换，见 config.yaml 的 api_keys
NSCC_API_KEY_2: ""
NSCC_API_KEY_3: ""

# 阿里云百炼 DashScope（dashscope 档位）
DASHSCOPE_API_KEY: ""

# DeepSeek（deepseek 档位）
DEEPSEEK_API_KEY: ""

# OpenAI（default 档位）
OPENAI_API_KEY: ""
