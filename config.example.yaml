# =============================================================
#  MiniCode 配置模板（可安全提交到仓库）
#  使用方式：cp config.example.yaml config.yaml，然后填入自己的凭据。
#  config.yaml 已在 .gitignore 中；也可以完全不改它，只用环境变量。
# =============================================================

active_profile: default

profiles:
  default:
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"     # 从环境变量读取；也可直接写成 "sk-xxx"（不推荐）
    model: "gpt-4o-mini"
    temperature: 0.2
    max_tokens: 4096
    timeout: 120
    native_tools: true               # 不支持 function calling 的模型请设为 false

  # 备用密钥（可选）：主 key 报 401/403/429 或额度耗尽时，
  # 按顺序自动轮换到下一把，用完即止。留空列表 = 只用 api_key 一把钥匙。
  nscc:
    base_url: "https://maas.nscc-cs.cn/external/api/v1"
    api_key: "${NSCC_API_KEY}"
    api_keys: []                      # 例：["${NSCC_API_KEY_2}", "${NSCC_API_KEY_3}"]
    model: "Qwen3.5"
    temperature: 0.2
    max_tokens: 8192
    timeout: 180
    native_tools: true

  deepseek:
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    temperature: 0.2
    max_tokens: 8192
    timeout: 180
    native_tools: true

agent:
  # 生成代码的家：所有最新代码放在这里（已 gitignore，不会污染项目根目录）
  workspace: "workplace"
  # 每个任务以"任务名"在 workplace 下建一个文件夹，例如
  #   workplace/user_login/           ← 任务最新代码
  #   .agent_backups/user_login_20260129_143022_第1次/   ← 与 workplace 同级的历史备份
  # 任务名可用 python run.py --name user_login 指定；不指定时由任务描述自动生成。
  per_task_dir: true
  max_steps: 60
  max_steps_without_progress: 8
  max_consecutive_errors: 4
  max_parse_retries: 2
  command_timeout: 120
  # 交互式挂死检测：命令长时间（默认 20s）零新输出、且缓冲区停在未换行的提示符上，
  # 判定为疑似等待输入，提前终止，避免把进程挂到整体超时。（见 agent/tools/shell.py）
  interactive_timeout: 20.0
  max_tool_output_chars: 12000
  max_file_read_chars: 40000
  max_context_tokens: 96000
  reserve_tokens: 4000
  compact_keep_recent: 8
  auto_compact: true
  compact_threshold: 0.75
  restrict_to_workspace: true
  command_policy: confirm            # allow | confirm | deny
  backup_on_write: true
  stream: true                       # 边生成边打印；网关不支持流式时自动退回整包，不会失败
  session_log: ".agent_sessions"

dangerous_commands: []               # 留空则使用 security.py 内置黑名单
